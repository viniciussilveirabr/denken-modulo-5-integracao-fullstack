services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitboard-backend
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_URLS: http://+:5200
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5200
    container_name: orbitboard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
